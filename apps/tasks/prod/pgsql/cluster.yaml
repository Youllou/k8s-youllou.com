apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tasks-pg
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  affinity:
    podAntiAffinityType: preferred
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: taskapp
      owner: taskapp
